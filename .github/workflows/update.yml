name: Update Sepehr IRIB EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Generate M3U + EPG
        run: python generate.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sepehr.m3u sepehr.xml sepehr.xml.gz
          if git diff --staged --quiet; then
            echo "تغییری نبود"
          else
            git commit -m "به‌روزرسانی خودکار EPG — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
