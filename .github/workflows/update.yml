name: Update Sepehr IRIB EPG
on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests requests-oauthlib
      - name: API health check + auto-fallback
        run: python api_check.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sync channels (weekly discovery)
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: python sync_channels.py
      - name: Generate M3U + EPG
        run: python generate.py
      - name: Generate Sepehr live streams
        run: python generate_sepehr_live.py
        continue-on-error: true
      - name: Generate Sepehr VOD catalog
        run: python generate_sepehr_vod.py
        continue-on-error: true
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch api_config.json
          git add sepehr.m3u sepehr.xml sepehr.xml.gz channels.json api_config.json sepehr_live.m3u sepehr_vod.m3u sepehr_vod.xml sepehr_vod.xml.gz
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "auto-update EPG + channels -- $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
